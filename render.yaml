services:
  # Express Backend API Server
  - type: web
    name: hemma-sudan-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hemma-sudan-db
          property: connectionString

  # Vite React Static Frontend (Render Static Site option)
  - type: web
    name: hemma-sudan-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: hemma-sudan-api
          property: host

databases:
  - name: hemma-sudan-db
    databaseName: hemma_sudan
    user: hemma_user
    plan: free
