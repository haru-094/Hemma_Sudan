services:
  # Express Backend API Server (100% Free Tier, No Credit Card Required)
  - type: web
    name: hemma-sudan-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
