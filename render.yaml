services:
  # Express Backend API Server (100% Free Tier, No Credit Card Required)
  - type: web
    name: hemma-sudan-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: TEACHER_EMAIL
        value: teacher@hemma.sd
      - key: TEACHER_PASSWORD
        value: TeacherSecurePass2026!
      - key: TEACHER_NAME
        value: Dr. Tariq Ahmed
      - key: DEMO_MODE
        value: "true"
